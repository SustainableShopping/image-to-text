name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      model_tests:
        description: Also run the real OCR model tests (downloads models)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and test (dev container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ITT_RUN_MODEL_TESTS: ${{ inputs.model_tests && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          env: |
            CI
            ITT_RUN_MODEL_TESTS
          runCmd: |
            set -e
            cd backend
            uv run ruff check .
            uv run ruff format --check .
            uv run pytest --cov
            if [ "$ITT_RUN_MODEL_TESTS" = "1" ]; then uv run pytest -m models --no-cov; fi
