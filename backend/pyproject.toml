[project]
name = "image-to-text"
version = "0.1.0"
description = "Packaging-photo OCR service: quality gate, pluggable OCR engines, text extraction."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",  # image arrays in the Engine interface (ocr/base.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # fastapi.testclient
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_to_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["image_to_text"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80  # RULES.md §4

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
